<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AI chatbot for Canadian real estate agents">
  <!--
    Replaces blog-ai-chatbot.jpg, which showed a humanoid ROBOT on a laptop
    screen over a fake chat interface with garbled text. A robot is a dated and
    inaccurate metaphor for what this product is: a text and voice assistant
    that answers leads in English and French.

    Built on the pattern set by blog-database-reactivation.jpg — the one asset
    already doing this properly. Navy ground, terracotta accent, correct legible
    typography, and abstract message shapes carrying NO fabricated names,
    figures or interface text. The grey bars are placeholders and read as
    placeholders; they are not pretending to be a screenshot.

    SVG rather than raster: it is 3KB instead of 90KB, sharp at every density,
    needs no AVIF/WebP sibling, and the brand colours are the real token values
    rather than an approximation an image model guessed at.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2540"/>
      <stop offset="100%" stop-color="#071A2E"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#D7714E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#D7714E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- Wordmark -->
  <g transform="translate(72 78)">
    <text font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19"
          font-weight="700" letter-spacing="3.4" fill="#D7714E">REALTORDESK AI</text>
    <!-- A maple leaf belongs here, matching blog-database-reactivation.jpg.
         My first attempt drew a generic starburst instead, and a national
         symbol rendered wrong is worse than one left out. Omitted until the
         real leaf path is available rather than approximated. -->
  </g>

  <!-- Title -->
  <text x="72" y="238" font-family="Georgia, Times New Roman, serif" font-size="70"
        font-weight="700" fill="#FFFFFF">AI Chatbot</text>
  <text x="72" y="316" font-family="Georgia, Times New Roman, serif" font-size="70"
        font-weight="700" fill="#FFFFFF">for Agents</text>

  <rect x="72" y="352" width="86" height="5" rx="2.5" fill="#D7714E"/>

  <text x="72" y="404" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="23" fill="#AFC2D6">Answers every enquiry the instant it lands,</text>
  <text x="72" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="23" fill="#AFC2D6">in English or French.</text>

  <!--
    Abstract exchange. Deliberately no words inside the bubbles: the moment
    they carry legible text they start asserting something the product did not
    actually say.

    The label reads "Replied automatically", not "Answered in seconds". The
    second is a performance figure dressed as a caption, and a version of
    exactly the fabricated "32s / -96%" KPI removed from the hero in PR #173.
    "Replied automatically" describes the mechanism, which is true by
    construction, and claims no duration.
  -->
  <g transform="translate(690 150)">
    <!-- incoming -->
    <g>
      <rect x="0" y="0" width="300" height="86" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
      <circle cx="34" cy="43" r="17" fill="#FFFFFF" fill-opacity="0.16"/>
      <rect x="64" y="30" width="176" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.30"/>
      <rect x="64" y="49" width="120" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="0" y="112" font-family="Inter, Helvetica Neue, Arial, sans-serif"
            font-size="15" fill="#7E93AA">New enquiry</text>
    </g>

    <!-- connector -->
    <path d="M150 132 C150 168, 232 168, 232 196" stroke="#D7714E" stroke-width="2.5"
          fill="none" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path d="M232 196 l-6.5 -9 h13 z" fill="#D7714E"/>

    <!-- reply -->
    <g transform="translate(82 206)">
      <rect x="0" y="0" width="300" height="86" rx="16" fill="#FFFFFF"/>
      <circle cx="34" cy="43" r="17" fill="#D7714E"/>
      <rect x="64" y="30" width="196" height="9" rx="4.5" fill="#0B2540" fill-opacity="0.78"/>
      <rect x="64" y="49" width="132" height="9" rx="4.5" fill="#0B2540" fill-opacity="0.34"/>
      <text x="0" y="112" font-family="Inter, Helvetica Neue, Arial, sans-serif"
            font-size="15" font-weight="600" fill="#E8A98F">Replied automatically</text>
    </g>
  </g>
</svg>
